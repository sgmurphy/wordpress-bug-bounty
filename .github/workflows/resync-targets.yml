name: Resync WordPress Plugins & Themes

# One-off backfill: re-mirror every tracked target at its current version so
# repos drop files that were removed upstream.
on:
  workflow_dispatch:

# Share the mirror's group so scheduled mirrors can't push newer versions that
# this run would then overwrite with the older versions in its targets.json
concurrency:
  group: mirror-targets
  cancel-in-progress: false

jobs:
  resync:

    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - run: pip install -r requirements.txt
    - run: python mirror-targets.py --resync ${{ matrix.shard }}/${{ strategy.job-total }}
      env:
        GH_TOKEN: ${{ secrets.WORDPRESS_BUG_BOUNTY_GITHUB_TOKEN }}
